<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Argon Squash • Pocket Racket &amp; Let Controller</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #102a45, #06101c 80%);
      color: #f0f9ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 35, 60, 0.85);
      border: 1px solid rgba(125, 211, 252, 0.3);
      border-radius: 14px;
      padding: 10px 14px;
    }
    .title { font-weight: 800; font-size: 16px; letter-spacing: 0.04em; color: #38bdf8; }
    .status-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.45);
    }
    .sensor-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #38bdf8;
      background: linear-gradient(180deg, #0284c7, #0369a1);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .racket-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(12, 28, 48, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      position: relative;
    }
    .swing-zone-btn {
      width: 100%;
      padding: 26px 16px;
      border-radius: 18px;
      border: 2px solid rgba(163, 230, 53, 0.75);
      background: linear-gradient(180deg, rgba(63, 98, 18, 0.9), rgba(26, 46, 5, 0.95));
      color: #ecfccb;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .swing-zone-btn:active { transform: scale(0.98); }
    .shot-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 12px;
    }
    .shot-btn {
      padding: 14px 10px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      font-weight: 700;
      font-size: 14px;
    }
    .shot-btn:active { background: #0284c7; border-color: #7dd3fc; }
    .let-call-btn {
      width: 100%;
      padding: 20px 16px;
      border-radius: 16px;
      border: 2px solid #facc15;
      background: linear-gradient(180deg, #ca8a04, #854d0e);
      color: #fef08a;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.03em;
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.35);
    }
    .let-call-btn:active {
      transform: scale(0.97);
      background: linear-gradient(180deg, #eab308, #a16207);
    }
    .telemetry-readout {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🎾 ARGON SQUASH RACKET</div>
    <div id="conn-badge" class="status-badge">Connected</div>
  </div>

  <button id="btn-enable-imu" class="sensor-btn" type="button">
    📲 Tap to Enable Inertial 3D Motion Sensors
  </button>

  <div class="racket-pad">
    <button id="btn-swing-drive" class="swing-zone-btn" type="button">
      ⚡ SWING RACKET (Or Whip Phone)
    </button>

    <div class="shot-grid">
      <button class="shot-btn" data-shot="drop" type="button">2: Cut Drop (+34°)</button>
      <button class="shot-btn" data-shot="boast" type="button">3: 2-Wall Boast</button>
      <button class="shot-btn" data-shot="lob" type="button">4: High Lob</button>
      <button class="shot-btn" data-shot="smash" type="button">5: Volley Kill</button>
    </div>

    <button id="btn-call-let-phone" class="let-call-btn" type="button">
      ✋ CALL LET! (Stop Play / Interference)
    </button>

    <div id="imu-readout" class="telemetry-readout">
      Tip: Swing phone to strike • Hold phone vertically upright (Pitch ≥ 58°) or tap <strong>✋ CALL LET!</strong> when obstructed instead of hitting your opponent!
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const room = params.get('room') || 'default';
      const role = params.get('role') || 'p1';
      let pitch = 0, roll = 0, yaw = 0, accelMag = 0;
      let lastSwingMs = 0;
      let lastLetMs = 0;
      let uprightStartMs = 0;

      function sendSwing(type, shotType, speed) {
        fetch('/api/racket/swing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            room,
            role,
            type: type || 'swing',
            shotType: shotType || 'topspin',
            speed: speed || 1.2,
            pitch,
            roll,
            yaw,
            source: 'phone'
          })
        }).catch(() => {});
        if (navigator.vibrate) {
          navigator.vibrate(type === 'let' ? [50, 40, 70] : [35]);
        }
      }

      document.getElementById('btn-swing-drive').addEventListener('click', () => {
        sendSwing('swing', 'topspin', 1.25);
      });

      document.querySelectorAll('.shot-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const st = btn.getAttribute('data-shot') || 'topspin';
          sendSwing('swing', st, st === 'drop' ? 0.88 : 1.22);
        });
      });

      document.getElementById('btn-call-let-phone').addEventListener('click', () => {
        lastLetMs = performance.now();
        sendSwing('let', 'let', 0);
        document.getElementById('imu-readout').textContent = '✋ LET APPEAL SENT TO REFEREE!';
      });

      function bindSensors() {
        window.addEventListener('deviceorientation', (e) => {
          pitch = Number(e.beta || 0);
          roll = Number(e.gamma || 0);
          yaw = Number(e.alpha || 0);
        });
        window.addEventListener('devicemotion', (e) => {
          const a = e.accelerationIncludingGravity || e.acceleration || { x: 0, y: 0, z: 0 };
          const mag = Math.hypot(Number(a.x || 0), Number(a.y || 0), Number(a.z || 0));
          accelMag = Math.max(0, mag - 9.8);
          const now = performance.now();
          if (accelMag > 13.5 && now - lastSwingMs > 340) {
            lastSwingMs = now;
            const isCut = Math.abs(roll) > 28;
            sendSwing('swing', isCut ? 'drop' : 'topspin', Math.min(1.6, 0.95 + accelMag / 24));
          }
          // Upright stop gesture on phone
          if (pitch >= 58 && accelMag < 4.2) {
            if (!uprightStartMs) uprightStartMs = now;
            else if (now - uprightStartMs > 260 && now - lastLetMs > 1200) {
              uprightStartMs = 0;
              lastLetMs = now;
              sendSwing('let', 'let', 0);
              document.getElementById('imu-readout').textContent = '✋ UPRIGHT STOP GESTURE → LET CALLED!';
            }
          } else {
            uprightStartMs = 0;
          }
        });
      }

      document.getElementById('btn-enable-imu').addEventListener('click', async () => {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          try { await DeviceMotionEvent.requestPermission(); } catch {}
        }
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try { await DeviceOrientationEvent.requestPermission(); } catch {}
        }
        bindSensors();
        document.getElementById('btn-enable-imu').textContent = '✅ 3D Inertial Racket + Upright Let Active';
      });

      bindSensors();

      setInterval(() => {
        fetch('/api/racket/telemetry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room, role, pitch, roll, yaw, accelMag, connected: true })
        }).catch(() => {});
      }, 120);
    })();
  </script>
</body>
</html>
