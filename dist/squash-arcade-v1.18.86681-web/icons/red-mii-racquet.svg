      <ellipse cx="44.2" cy="54.8" rx="5.6" ry="6.7" fill="url(#iris-squash-app)" />
      <circle cx="44.2" cy="54.8" r="3.1" fill="#090c12" />
      <circle cx="41.8" cy="51.8" r="2.5" fill="#ffffff" />
      <circle cx="46.2" cy="57.2" r="1.25" fill="#ffffff" />
      <path d="M 34.8 53.5 C 35.8 46.2, 51.2 46.2, 52.2 53.5" stroke="#181412" stroke-width="2.6" stroke-linecap="round" fill="none" />

      <!-- Right Eye -->
      <ellipse cx="76.5" cy="54.5" rx="8.2" ry="9.4" fill="#ffffff" stroke="#cfdbe6" stroke-width="0.9" />
      <ellipse cx="75.8" cy="54.8" rx="5.6" ry="6.7" fill="url(#iris-squash-app)" />
      <circle cx="75.8" cy="54.8" r="3.1" fill="#090c12" />
      <circle cx="73.8" cy="51.8" r="2.5" fill="#ffffff" />
      <circle cx="78.2" cy="57.2" r="1.25" fill="#ffffff" />
      <path d="M 67.8 53.5 C 68.8 46.2, 84.2 46.2, 85.2 53.5" stroke="#181412" stroke-width="2.6" stroke-linecap="round" fill="none" />
      
    </g>

    

    <!-- Sculpted 3D Nintendo Mii Button Nose -->
    <g class="mii-nose">
      <ellipse cx="60" cy="61.8" rx="5.4" ry="4.2" fill="rgba(165, 88, 48, 0.24)" />
      <ellipse cx="60" cy="59.6" rx="5.4" ry="4.6" fill="url(#nose-squash-app)" />
      <path d="M 55 58.5 C 54.2 62.8, 57 64.8, 60 64.8 C 63 64.8, 65.8 62.8, 65 58.5" stroke="#c9825b" stroke-width="1.65" stroke-linecap="round" fill="none" />
      <ellipse cx="58.4" cy="57.8" rx="2.1" ry="1.4" fill="rgba(255, 255, 255, 0.55)" />
    </g>

    <!-- Mouth / Smile -->
    <g class="mii-mouth">
      
      <path d="M 47.5 70.5 C 50.5 81, 69.5 81, 72.5 70.5 C 65 72.5, 55 72.5, 47.5 70.5 Z" fill="#5e1b18" stroke="#421210" stroke-width="1.4" stroke-linejoin="round" />
      <path d="M 49 71.2 C 55 72.8, 65 72.8, 71 71.2 L 69.5 74.8 C 64 75.8, 56 75.8, 50.5 74.8 Z" fill="#ffffff" />
      <path d="M 52.5 76.2 C 56 74.2, 64 74.2, 67.5 76.2 C 64.5 79.5, 55.5 79.5, 52.5 76.2 Z" fill="#ff7d7d" />
      <path d="M 45.8 69.5 C 44.5 70.8, 44.8 72.5, 46.2 73.2 M 74.2 69.5 C 75.5 70.8, 75.2 72.5, 73.8 73.2" stroke="#c9825b" stroke-width="1.3" stroke-linecap="round" fill="none" />
    
    </g>

    <!-- Eyebrows -->
    <g class="mii-brows">
      
      <path d="M 33 45 Q 43 41 52 44.5" stroke="#361b0b" stroke-width="4.0" stroke-linecap="round" fill="none" />
      <path d="M 68 44.5 Q 77 41 87 45" stroke="#361b0b" stroke-width="4.0" stroke-linecap="round" fill="none" />
    
    </g>

    <!-- Hair & Athletic Headband / Visor -->
    <g class="mii-hair-headgear">
      
      <path d="M 23 43 C 20 26, 29 15, 41 16 C 47 9, 59 8, 65 14 C 72 9, 83 11, 88 19 C 96 22, 100 31, 97 43 C 95 49, 95 54, 93 55 L 91 41 C 83 35, 37 35, 29 41 L 27 55 C 25 54, 25 49, 23 43 Z" fill="url(#hair-squash-app)" />
      <path d="M 27 38 C 27 25, 34 18, 43 20 C 48 13, 58 12, 64 18 C 70 13, 80 15, 84 22 C 91 24, 94 31, 93 38 Z" fill="url(#hair-squash-app)" />
      <path d="M 33 25 C 37 19, 43 19, 46 23 C 51 16, 60 15, 64 21 C 70 16, 78 17, 83 24 C 77 21, 70 20, 64 24 C 58 19, 51 20, 46 26 C 41 22, 36 22, 33 25 Z" fill="rgba(255, 220, 185, 0.30)" />
      <!-- Forehead headband shadow -->
      <path d="M 22 37 C 38 31, 82 31, 98 37 L 97 43.5 C 82 38, 38 38, 23 43.5 Z" transform="translate(0, 1.8)" fill="rgba(110, 52, 22, 0.25)" />
      <!-- Crisp White Tennis Headband with Orange-Red Stripe (matches render_03_assets_lineup.png) -->
      <path d="M 22 37 C 38 31, 82 31, 98 37 L 97 43.5 C 82 38, 38 38, 23 43.5 Z" fill="url(#visor-white-squash-app)" stroke="#d5e0ec" stroke-width="0.9" />
      <path d="M 22.5 40.2 C 38 34.5, 82 34.5, 97.5 40.2" stroke="#e83b28" stroke-width="2.6" stroke-linecap="round" fill="none" />
    
    </g>
  </g>

  <!-- Subtle Crisp Outer Badge Rim Highlight -->
  <circle cx="60" cy="60" r="55.2" fill="none" stroke="rgba(255, 230, 220, 0.72)" stroke-width="1.6" />
</svg></g>
<g transform="translate(610 714) rotate(32)" stroke-linecap="round" stroke-linejoin="round">
