<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<title>Virtual Squash — red player with squash racquet</title>
<defs><radialGradient id="court"><stop stop-color="#20435f"/><stop offset="1" stop-color="#071321"/></radialGradient>
<linearGradient id="rim"><stop stop-color="#fff4bc"/><stop offset=".45" stop-color="#ffca41"/><stop offset="1" stop-color="#f8882b"/></linearGradient>
<clipPath id="strings"><ellipse cy="-265" rx="91" ry="139"/></clipPath></defs>
<path fill="url(#court)" d="M0 0h1024v1024H0z"/>
<circle cx="512" cy="512" r="425" fill="none" stroke="#ffd35a" stroke-width="9" opacity=".65"/>
<g transform="rotate(-13 460 510)"><svg x="110" y="130" width="700" height="700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="wii-mii-svg" data-mii-id="player1" role="img" aria-label="Ammaar Mii Portrait">
  <defs>
    <clipPath id="badge-clip-squash-app">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
    <radialGradient id="badge-bg-squash-app" cx="50%" cy="45%" r="56%">
      <stop offset="0%" stop-color="rgba(255, 118, 88, 0.56)" />
      <stop offset="72%" stop-color="rgba(220, 44, 24, 0.22)" />
      <stop offset="100%" stop-color="rgba(12, 16, 22, 0.35)" />
    </radialGradient>
    <radialGradient id="skin-squash-app" cx="42%" cy="35%" r="64%">
      <stop offset="0%" stop-color="#fff4e8" />
      <stop offset="58%" stop-color="#ffdfc4" />
      <stop offset="100%" stop-color="#e8aa86" />
    </radialGradient>
    <radialGradient id="nose-squash-app" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fff4e8" />
      <stop offset="55%" stop-color="#ffdfc4" />
      <stop offset="100%" stop-color="#de926b" />
    </radialGradient>
    <radialGradient id="blush-squash-app" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 105, 95, 0.38)" />
      <stop offset="100%" stop-color="rgba(255, 110, 100, 0)" />
    </radialGradient>
    <linearGradient id="hair-squash-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b3c1e" />
      <stop offset="55%" stop-color="#4a2812" />
      <stop offset="100%" stop-color="#2e1709" />
    </linearGradient>
    <linearGradient id="shirt-squash-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f64a35" />
      <stop offset="100%" stop-color="#c62312" />
    </linearGradient>
    <linearGradient id="visor-white-squash-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5eef7" />
    </linearGradient>
    <linearGradient id="iris-squash-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121824" />
      <stop offset="100%" stop-color="#2c3d59" />
    </linearGradient>
  </defs>

  <g clip-path="url(#badge-clip-squash-app)">
    <!-- Glowing Team Backdrop -->
    <circle cx="60" cy="60" r="56" fill="url(#badge-bg-squash-app)" />

    <!-- Sporty Polo Shirt Shoulders & Crisp White Collar -->
    <path d="M 15 120 C 17 95, 35 87, 60 87 C 85 87, 103 95, 105 120 Z" fill="url(#shirt-squash-app)" stroke="rgba(0,0,0,0.28)" stroke-width="1.4" />
    <path d="M 22 116 C 25 97, 40 90, 60 90 C 80 90, 95 97, 98 116 L 92 116 C 89 101, 76 94, 60 94 C 44 94, 31 101, 28 116 Z" fill="rgba(255,255,255,0.16)" />

    <!-- Neck & Chin Shadow -->
    <rect x="50" y="80" width="20" height="14" rx="6" fill="#e8aa86" />
    <path d="M 51 85 L 60 96 L 69 85 Z" fill="#e8aa86" />

    <!-- White Polo Placket & Collar Flaps (matches render_03_assets_lineup.png) -->
    <rect x="56.2" y="91" width="7.6" height="19" rx="2.6" fill="#ffffff" stroke="#d4e0ec" stroke-width="0.9" />
    <circle cx="60" cy="96.5" r="1.2" fill="#b8c8d8" />
    <circle cx="60" cy="102.5" r="1.2" fill="#b8c8d8" />
    <path d="M 46 85 C 39 87, 37 94, 44 98 L 58 94 L 51 85 Z" fill="#ffffff" stroke="#d0dce8" stroke-width="1.1" stroke-linejoin="round" />
    <path d="M 74 85 C 81 87, 83 94, 76 98 L 62 94 L 69 85 Z" fill="#ffffff" stroke="#d0dce8" stroke-width="1.1" stroke-linejoin="round" />

    <!-- Symmetrical Plump Mii Ears -->
    <g>
      <ellipse cx="23" cy="57.5" rx="7.2" ry="10.2" transform="rotate(-7 23 57.5)" fill="url(#skin-squash-app)" stroke="#c9825b" stroke-width="1.5" />
      <path d="M 23.5 53 C 20.5 54, 20.5 60, 23.8 61.5" stroke="#de926b" stroke-width="1.7" stroke-linecap="round" fill="none" />
      <ellipse cx="97" cy="57.5" rx="7.2" ry="10.2" transform="rotate(7 97 57.5)" fill="url(#skin-squash-app)" stroke="#c9825b" stroke-width="1.5" />
      <path d="M 96.5 53 C 99.5 54, 99.5 60, 96.2 61.5" stroke="#de926b" stroke-width="1.7" stroke-linecap="round" fill="none" />
    </g>

    <!-- Plump Rounded Nintendo Mii Head -->
    <path d="M 60 20 C 79 20, 91 31, 93 48 C 95 62, 96 71, 86 81 C 78 88, 69 91, 60 91 C 51 91, 42 88, 34 81 C 24 71, 25 62, 27 48 C 29 31, 41 20, 60 20 Z" fill="url(#skin-squash-app)" stroke="#c9825b" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M 38 30 C 48 23, 72 23, 82 30 C 75 27, 45 27, 38 30 Z" fill="rgba(255, 255, 255, 0.34)" />

    <!-- Warm Rosy Cheek Blushes -->
    <ellipse cx="35.5" cy="65.5" rx="8.5" ry="5.2" fill="url(#blush-squash-app)" />
    <ellipse cx="84.5" cy="65.5" rx="8.5" ry="5.2" fill="url(#blush-squash-app)" />

