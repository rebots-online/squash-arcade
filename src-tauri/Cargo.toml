[package]
name = "squash-arcade"
version = "1.13.83621"
description = "Squash Arcade"
authors = ["Robin L. M. Cheung"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/rebots-online/squash-arcade"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
